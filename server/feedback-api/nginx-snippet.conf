# 留言板反代片段 —— 贴进每个站的 443 主 server 块
# ============================================================================
# 每个站的差别只有一行：X-Site 的值 = 该站在 sites.mjs 里的 id。
#
# 为什么用 `proxy_set_header X-Site <id>` 而不是让后端解析 Host：
#   nginx 的 proxy_set_header 是**覆盖**语义 —— 客户端自带一个 X-Site 头，
#   到这里会被替换成服务器指定的值。后端因此可以无条件信任它，
#   站点归属完全由 nginx 配置决定，可审计、不可伪造。
#
# 为什么用 `^~`：
#   web-training 的 vhost 里有若干正则 location（\.(css|js)$ 等）。
#   nginx 先取最长前缀、再依次试正则；`^~` 让这个前缀匹配一旦命中
#   就跳过正则检查，避免将来有人加一条宽正则把 /api/ 抢走。
#
# 为什么用 `proxy_pass http://127.0.0.1:8792;` 结尾不带斜杠：
#   带斜杠会把 /api/ 前缀吞掉，后端收到 /feedback 而不是 /api/feedback。
#
# 端口分配（同机共存，勿随意改）：
#   8791  widget-api    —— widget 站专用（单站版，2026-11-02 上线）
#   8792  feedback-api  —— 本站群五站共用（多站版）
#   3000  / 6080 / 9222 已有其它进程占用（node / noVNC / chrome），不要碰

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Site            __SITE_ID__;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
}

# ── 每站替换表 ──
#   llc            →  X-Site llc
#   interleavedpfc →  X-Site interleavedpfc
#   ahb            →  X-Site ahb
#   optical        →  X-Site optical
#   web-training   →  X-Site web-training
#
# 落位提醒：
#   · 必须写在 443 的 **服务** server 块里（www 那个），不要写进裸名的 301 块；
#   · web-training 的 vhost 里有 `location = /index.html { internal; }`，
#     与本片段无冲突；但 `location /` 的 try_files 不能吃掉 /api/ —— 前缀匹配
#     优先于普通前缀，只要本片段存在就不会落到 try_files。
#   · 改完执行 nginx -t，必须 reload 而不是 restart（同机还有别的站）。

# ============================================================================
# 2026-11-10 补接三个公开站（control-mode / motor-lighting / english）
# ============================================================================
# 这三个站上线时漏配，站内没有留言入口、后台也看不到数据。
# 三站的 vhost 都加了同一段：
#
#   location ^~ /api/ {
#       proxy_pass http://127.0.0.1:8792;
#       ...（与上面 ahb 等站完全一致）
#       proxy_set_header X-Site <站点 id>;
#   }
#
# ⚠️ 落位因站而异，别照抄行号：
#   · control-mode   → /etc/nginx/sites-available/control-mode     （443 www 服务块内）
#   · motor-lighting → /etc/nginx/sites-available/motor-lighting   （443 www 服务块内）
#   · english        → **不在 sites-available！** 它的 sites-enabled 是软链，
#                      指向 /var/www/english/deploy/nginx-english.conf（仓库内的文件）。
#                      改 sites-available/english 完全不生效 —— 我第一轮就这么白改了一次。
#                      正确做法是改 english 仓库的 deploy/nginx-english.conf 再同步过去。
#
# 验证方式：`curl -sL https://<host>/api/health` 应返回 {"ok":true,...}。
# 注意 `/api/feedback` 用 GET 请求对**所有站**都返回 404（那是 POST 端点），
# 拿它当探针会误判成"反代没生效"。
