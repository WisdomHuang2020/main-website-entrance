# 后台 API 反代 + 缺失的站点日志（2026-11-10）
# ============================================================================
# 两处改动，都在 /etc/nginx/sites-available/ 下：
#
#   ① entrance 的 443 server 块：把 /api/admin/ 指向 analytics 服务（8793）
#   ② motor-lighting 的 443 server 块：补一条 access_log（原先没配，
#      请求全落到默认 /var/log/nginx/access.log，统计时无法归属到该站）
#
# ── ① entrance ─────────────────────────────────────────────────────────────
# 放在已有的 `location ^~ /api/`（→ 8792 feedback-api）**旁边**即可。
# nginx 前缀匹配取最长者，`/api/admin/` 比 `/api/` 长，会自动优先命中，
# 与书写顺序无关；两个都用 `^~` 则都跳过正则检查，不会被 web-training 那类
# 正则 location 抢走。
#
#   location ^~ /api/admin/ {
#       proxy_pass http://127.0.0.1:8793;
#       proxy_http_version 1.1;
#       proxy_set_header Host              $host;
#       proxy_set_header X-Real-IP         $remote_addr;
#       proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_read_timeout 30s;
#       client_max_body_size 8k;
#   }
#
# ── ② motor-lighting ───────────────────────────────────────────────────────
# 在该站 443 的**服务** server 块（www 那个，不是裸名 301 块）里加：
#
#   access_log /var/log/nginx/motor-lighting.access.log;
#
# 这样它与其它站一致：一个站一个日志文件，统计脚本按文件名归属。
# 裸名 301 块不必加 —— 跳转请求不算页面访问。
#
# ── 落位提醒 ───────────────────────────────────────────────────────────────
# · 改完必须 `nginx -t` 再 `systemctl reload nginx`（同机还有别的站，不要 restart）；
# · 日志文件权限应是 www-data:adm 640 —— nginx 自己创建时就是这个属主，
#   analytics 服务以 www-data 运行，无需额外授权；
# · 若手工 touch 了日志文件，记得 `chown www-data:adm` 并 `chmod 640`。
