# 站群对照表（文档性质）
#
# ⚠️ 本文件是**人读的文档**，不被任何工作流解析。
#    部署时真正生效的值来自仓库的 LH_* secrets（见 .github/workflows/deploy-lighthouse.yml）。
#    改站点前请先改这张表，再同步 secrets 与 nginx。
#
# 最后核对：2026-09-28（各站已部署版本读自 /var/www/<id>/.deployed-version）

entrance:
  repo:    git@github.com:WisdomHuang2020/main-website-entrance.git
  branch:  main
  domain:  power-knowledge.tech            # apex，需显式进证书 SAN（通配符不覆盖裸域）
  alias:   www.power-knowledge.tech        # 一级子域，被 *.power-knowledge.tech 覆盖
  pages:   https://wisdomhuang2020.github.io/main-website-entrance/
  lighthouse:
    instance_id: lhins-6i7vay90
    region:      ap-shanghai
    host:        43.142.148.37
    user:        root
    web_root:    /var/www/entrance
    owner:       www-data
    port:        22
  dist:    dist
  build:   npm run build

# 入口页所指向的 5 个子站（供巡检脚本按 /var/www/<id> 读 .deployed-version）
sites:
  - id: llc
    repo:   git@github.com:WisdomHuang2020/LLC-Design-Tool.git
    domain: llc.power-knowledge.tech
    web_root: /var/www/llc
    version: 2.10.80
  - id: interleavedpfc
    repo:   git@github.com:WisdomHuang2020/interleaved-pfc.git
    domain: interleavedpfc.power-knowledge.tech
    web_root: /var/www/interleavedpfc
    version: 0.4.2
  - id: ahb
    repo:   git@github.com:WisdomHuang2020/AHB.git
    domain: ahb.power-knowledge.tech
    web_root: /var/www/ahb
    version: 1.6.2
  - id: optical
    repo:   git@github.com:WisdomHuang2020/optical-calculator.git
    domain: optical.power-knowledge.tech
    web_root: /var/www/optical
    version: v3.11.4          # 注意：该站哨兵带 v 前缀，其余四站不带
  - id: widget
    repo:   git@github.com:WisdomHuang2020/widget.git
    domain: widget.power-knowledge.tech
    web_root: /var/www/widget
    version: 1.3.2
