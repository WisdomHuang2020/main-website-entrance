# power-knowledge.tech —— 站群入口门户
#
# 2026-09-28 新增。改造前 power-knowledge.tech 与 www.power-knowledge.tech 两个名字
# 挂在 sites-available/llc 的 server 块上（属历史预留），所以裸域一直显示的是 LLC 工具。
# 现在这两个名字归本文件，**必须同时把它们从 llc 的配置里删掉** ——
# 两个 server 块声明同一 server_name 会触发 nginx `conflicting server name` 警告，
# 且匹配顺序不可预期。
#
# 证书：复用 /etc/letsencrypt/live/pk-wildcard/，**无需重签**。
#   裸域 power-knowledge.tech 已在 SAN 内（*.power-knowledge.tech 只匹配一层标签，
#     不覆盖 apex，该名字是显式加进 SAN 的）；
#   www.power-knowledge.tech 是一级子域，被 *.power-knowledge.tech 覆盖。
#
# ── 2026-10-21 改动：主域归一 ──
# 定 power-knowledge.tech 为主域，www 全部 301 到主域，消除重复内容。
# 1) 裸域与 www 原本共用同一 server 块（同 root、同内容、互不跳转）；
#    现拆为四个块：80/443 × 裸域/www。
# 2) 80 端口 www 直接跳到 **主域 https**，不再先跳 https://www 再跳主域（避免两跳）。
# 3) 所有跳转硬编码 https://power-knowledge.tech，不使用 $host ——
#    否则 www 块里 $host 会保留 www，跳回自己形成循环。
# 4) www 的 443 块保留完整 TLS 配置：即使只回 301 也必须完成握手。
# 5) www 的 443 块同样下发 HSTS，避免 www 首次访问后不被强制升级。

# ── 80：主域，仅做 ACME 挑战 + 跳转 HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name power-knowledge.tech;

    include snippets/acme.conf;

    access_log /var/log/nginx/entrance.access.log;
    error_log  /var/log/nginx/entrance.error.log;

    location / {
        return 301 https://power-knowledge.tech$request_uri;
    }
}

# ── 80：www 副域，直接跳到主域 HTTPS（一跳到位）──
server {
    listen 80;
    listen [::]:80;
    server_name www.power-knowledge.tech;

    include snippets/acme.conf;

    access_log /var/log/nginx/entrance-www.access.log;
    error_log  /var/log/nginx/entrance-www.error.log;

    location / {
        return 301 https://power-knowledge.tech$request_uri;
    }
}

# ── 443：主域，主服务 ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/pk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security max-age=31536000 always;

    root /var/www/entrance;
    index index.html;

    include snippets/security-hardening.conf;

    access_log /var/log/nginx/entrance.access.log;
    error_log  /var/log/nginx/entrance.error.log;

    # ── 子站版本实时端点 ────────────────────────────────────────────────
    # 门户页面在**运行时**读取这几个端点，因此子站发版后无需重新发布门户。
    # 前端实现见 src/data/useLiveVersions.ts。
    #
    # 为什么不直接让浏览器跨子域去拿各站的 .deployed-version：
    #   ① 子站自己的 nginx 把隐藏文件封了 —— `location ~ /\.(?!well-known/) { deny all; }`，
    #      实测五个站一律 403；
    #   ② 即便不封，跨子域读响应体也要求目标站发 CORS 头，五个子站都没有。
    # 由门户 nginx 以**同源**端点转出，两个问题同时消失，且不必动任何子站配置。
    #
    # 哨兵文件由各子站自己的 CI 写入，属主 www-data、权限 644 —— nginx worker 读得到。
    # 用 `=` 精确匹配：精确匹配优先于正则 location，不会被上面的 security-hardening 误拦。
    # no-store：版本号是"要最新"的信息，绝不能缓存。
    location = /api/version/llc            { alias /var/www/llc/.deployed-version;             default_type text/plain; add_header Cache-Control "no-store"; }
    location = /api/version/interleavedpfc { alias /var/www/interleavedpfc/.deployed-version; default_type text/plain; add_header Cache-Control "no-store"; }
    location = /api/version/ahb            { alias /var/www/ahb/.deployed-version;             default_type text/plain; add_header Cache-Control "no-store"; }
    location = /api/version/widget         { alias /var/www/widget/.deployed-version;         default_type text/plain; add_header Cache-Control "no-store"; }
    location = /api/version/optical        { alias /var/www/optical/.deployed-version;        default_type text/plain; add_header Cache-Control "no-store"; }
    location = /api/version/web-training   { alias /var/www/web-training/.deployed-version; default_type text/plain; add_header Cache-Control "no-store"; }

    # ── 站群未读留言计数（2026-11-07 新增）──────────────────────────────
    # 产物由 server/unread-aggregator/ 每 60 秒只读统计两个留言库后写出，
    # 这里只是把它以同源端点转出 —— 与上面的 version 端点同一套做法。
    # 用 `=` 精确匹配：抢在 location / 的 try_files 之前。若写成普通前缀，
    # 产物缺失时会回落成 index.html（200 + HTML），前端会把整页当 JSON 解析。
    # 只暴露各站未读条数与生成时间，不含任何留言正文（口径见该目录 README）。
    # no-store：计数必须每次回源，绝不缓存。
    location = /api/unread {
        alias /var/lib/entrance-unread/unread.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # 本站当前是单页（无前端路由），try_files 的 fallback 不会真正生效；
    # 保留它是为了将来若引入路由时不必回头改 nginx。
    # favicon 缓存策略：2026-09-29 加（与 widget / wx-seastar 同步）。
    # favicon 是浏览器缓存最顽固的资源（独立缓存、Ctrl+F5 常不生效）。
    # 这里对裸 /favicon.svg 强制每回源校验，配合 index.html 引用上的
    # ?v=<内容哈希> 版本戳（见各站构建脚本），保证图标一改即生效。
    # 注：不要试图用 location 正则去区分带 query string 的请求 —— nginx 的
    #     location 只匹配 URI 路径、不含 query，那种规则永不命中（已实测）。
    location = /favicon.svg {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── 443：www 副域，301 到主域 ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/pk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security max-age=31536000 always;

    access_log /var/log/nginx/entrance-www.access.log;
    error_log  /var/log/nginx/entrance-www.error.log;

    return 301 https://power-knowledge.tech$request_uri;
}
