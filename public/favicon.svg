<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    POWER KNOWLEDGE 主入口 —— favicon
    造型：六边形外壳内的中心节点（门户 / 枢纽意象），与 BrandMark 组件完全同源。
    语义：多个子站工具汇聚到同一个入口 —— 它是入口，不是工具。
    配色遵循站群统一规范：深底 #0a0a0a / 主形 teal #14b8a6 / amber #f59e0b 仅标关键点。
    2026-09-29 二次修订：favicon 与页头 BrandMark 现使用同一套 path（六边形描边 + 中心节点），
    不再存在「favicon 缺三条辐条、与 BrandMark 不一致」的情况。
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <path d="M16 4 L27.4 10.4 L27.4 21.6 L16 28 L4.6 21.6 L4.6 10.4 Z"
        fill="none" stroke="#14b8a6" stroke-width="3.2" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="3.2" fill="#f59e0b"/>
</svg>
