<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    POWER KNOWLEDGE 主入口 · favicon
    造型：六边形外壳内的中心节点（门户/枢纽意象），与站群其它站的
    波形/笔画取向刻意区分 —— 它是入口，不是工具。
    配色遵循站群统一规范: 深底 #0a0a0a / teal #14b8a6 主线 / amber #f59e0b 仅标关键点。
    2026-09-29 由紫 #818cf8 改为 teal，与各子站统一。

    注意：XML 注释内不得出现连续两个连字符（那会直接让文档不合法），
    故此处不写 CSS 自定义属性名。实际色值口径见 src/index.css 的品牌色定义。
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <path d="M16 4.6 26.2 10.5v11.6L16 27.9 5.8 22.1V10.5z"
        fill="none" stroke="#14b8a6" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="2.7" fill="#f59e0b"/>
</svg>
