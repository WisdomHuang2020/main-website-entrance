<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      favicon 指向 public/favicon.svg（Vite 会原样拷进 dist 根目录）。
      勿改成 /vite.svg —— 本仓库没有那个文件，线上会恒 404。
    -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Know-How·Tools·Skills·Systems·工具、课程与外贸英语学习站总入口</title>
    <!-- 2026-11-10：english（外贸邮件英语学习站）接入后，原 description 只列电源/光学工具
         与信息技术实训课，既漏了建模与控制、二轮车照明等站，也把新站排除在门户定位之外；
         一并补全，并把「输入数据不上传」收窄为「输入参数不回传」（留言是唯一的服务端落库）。 -->
    <meta
      name="description"
      content="power-knowledge.tech 站群总入口：LLC／交错并联 Boost PFC／AHB 反激等电源设计工具、光学与照明配光计算、建模与控制培训页、「从 0 到上线」网站建设实训课（10 阶段 32 讲），以及外贸邮件英语学习站（模板、句式与中式英语对照）。计算工具为纯前端应用，输入参数不回传服务器；另设需账号登录的团队内部系统入口。"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <!--
      首屏防闪：在 body 渲染前把上次选的主题盖到 <html> 上。
      ⚠️ 校验规则必须与 src/components/ThemeSwitcher.tsx 的 isThemeId 一致：
        ?theme= 优先 → 其次 localStorage['pk-theme'] → 非法值一律回落默认（深墨 teal）。
      写在这里而不是 React 组件里，是因为组件挂载晚于首次绘制 —— 放那儿会先闪一下默认配色。
      theme-color 也一起改：静态 meta 只能写一个值，浅色主题下深色地址栏会很突兀。
    -->
    <script>
      (function () {
        var IDS = ['dark-teal', 'blue', 'navy-tech', 'graphite', 'warm-paper', 'forest', 'indigo', 'sea-salt']
        var BG = {
          'dark-teal': '#0a0a0a', blue: '#f6f7f9', 'navy-tech': '#0b1a2b', graphite: '#f2f3f5',
          'warm-paper': '#faf6ed', forest: '#0c1712', indigo: '#f6f5fc', 'sea-salt': '#eef7f7',
        }
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var v = IDS.indexOf(q) >= 0 ? q : localStorage.getItem('pk-theme')
          if (IDS.indexOf(v) >= 0) {
            document.documentElement.dataset.theme = v
            var m = document.querySelector('meta[name="theme-color"]')
            if (m && BG[v]) m.setAttribute('content', BG[v])
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
